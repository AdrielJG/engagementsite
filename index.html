<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Engagement Ceremony of Joy Blessy & Cyril</title>
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f0d989;
    --cream: #f7ecd9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #0b1a4a;
  }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    color: var(--cream);
    display: flex;
    justify-content: center;
    padding: 36px 20px 56px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    width: 180px;
    height: auto;
    margin-bottom: 22px;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.45));
  }
  .subtitle {
    font-family: 'Brush Script MT', cursive;
    font-style: italic;
    font-size: 22px;
    color: var(--gold-light);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .names {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 1.5px;
    color: var(--cream);
    text-transform: uppercase;
    margin-bottom: 22px;
    line-height: 1.3;
  }
  .verse {
    font-style: italic;
    font-size: 14.5px;
    color: #e9e2cf;
    line-height: 1.6;
    max-width: 300px;
    margin-bottom: 6px;
  }
  .verse-ref {
    font-style: normal;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--gold-light);
    margin-bottom: 30px;
  }
  .icons {
    font-size: 22px;
    margin-bottom: 16px;
    letter-spacing: 14px;
  }
  .datetime {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    line-height: 1.8;
    color: var(--gold-light);
    text-transform: uppercase;
    margin-bottom: 46px;
  }
  .venue-block {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 300px;
    text-align: left;
  }
  .pin {
    font-size: 20px;
    color: var(--gold);
    line-height: 1.4;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .venue-text {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    line-height: 1.6;
    color: var(--cream);
    text-transform: uppercase;
  }
  .directions-link {
    display: inline-block;
    margin-top: 6px;
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.5px;
    color: var(--gold-light);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .directions-link:active {
    opacity: 0.7;
  }

  /* Desktop: show the invitation inside a phone-sized frame (same 375px width as style.css) */
  @media (min-width: 500px) {
    html { background: #111; }
    body {
      width: 375px;
      min-height: 812px;
      margin: 0 auto;
    }
  }
